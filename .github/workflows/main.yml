name: Fetch Plague News

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:         # allow manual trigger

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    concurrency:
      group: fetch-plague
      cancel-in-progress: false
    permissions:
      contents: write        # needed to push the JSON file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests feedparser newspaper3k lxml_html_clean brotli beautifulsoup4

      - name: Fetch, extract, and save
        run: python fetch_plague.py

      - name: Commit and push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plague_news.json
          git diff --staged --quiet || git commit -m "Update plague news [skip ci]"
          git push
